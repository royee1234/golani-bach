<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>בא״ח גולני · אגף ההדרכה</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1E4A2D">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="בא״ח גולני">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&family=Secular+One&display=swap">
<style>
/* Layout: one 1000px column. Home = hero + 2-col illustrated tiles (from the mockup);
   window page = status strip + sections; dashboard = summary first, then dense rows. */
:root {
  --bg: #F6F5EF;
  --surface: #FFFFFF;
  --surface-2: #ECEFE5;
  --ink: #18261C;
  --ink-2: #56635A;
  --line: #DCE1D4;
  --brand: #1E4A2D;
  --on-brand: #FFFFFF;
  --chip: #E3E8DC;
  --ok: #24764A;   --ok-bg: #E1F0E5;
  --warn: #9A6212; --warn-bg: #F7ECD6;
  --bad: #A8352A;  --bad-bg: #F6E0DC;
  --none: #6B736C; --none-bg: #ECEDE8;
  --on-art: #173A24;
  --art-chip: rgba(255,255,255,.72);
  --shadow: 0 1px 2px rgba(24,38,28,.06), 0 6px 18px rgba(24,38,28,.06);
  --f-display: "Secular One", "Assistant", "Segoe UI", Arial, sans-serif;
  --f-body: "Assistant", "Segoe UI", Arial, sans-serif;
  --r: 18px;
  /* login tree */
  --sun: rgba(236, 199, 84, .62); --ground: #DCE4D0;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #101611; --surface: #18201A; --surface-2: #1F2921; --ink: #E4EBE3; --ink-2: #9DAA9F;
    --line: #2C372E; --brand: #9CCBA6; --on-brand: #0F1A12; --chip: #253027;
    --ok: #7FD39C; --ok-bg: #1C3324; --warn: #E9B865; --warn-bg: #3A2D16;
    --bad: #F09486; --bad-bg: #3D1F1B; --none: #A5ADA6; --none-bg: #262D27;
    --shadow: 0 1px 2px rgba(0,0,0,.3); color-scheme: dark;
    --sun: rgba(222, 184, 72, .5); --ground: #1A231C;
  }
  .brand img { filter: brightness(2.6) saturate(.6); }
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.5;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
img { max-width: 100%; }
[hidden] { display: none !important; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--brand); }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
h1, h2, h3 { margin: 0; text-wrap: balance; }

.wrap { max-width: 1000px; margin: 0 auto; padding-block: 20px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* header */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
.top .acts { display: flex; align-items: center; gap: 8px; }
.brand { display: flex; align-items: center; gap: 10px; color: var(--ink); background: none; border: 0; padding: 0; cursor: pointer; text-align: right; }
.brand img { width: 46px; height: 53px; }
.brand b { display: block; font-family: var(--f-display); font-size: 1.45rem; line-height: 1; color: var(--brand); font-weight: 400; }
.brand span { font-size: .95rem; color: var(--ink-2); }
.pill-btn { border: 0; background: var(--chip); color: var(--ink); border-radius: 999px; padding: 8px 16px; font-weight: 600; cursor: pointer; white-space: nowrap; }
.pill-btn:hover { background: var(--line); }
.menu { position: relative; }
.menu summary { list-style: none; cursor: pointer; width: 40px; height: 40px; border-radius: 50%; background: var(--brand); color: var(--on-brand); display: grid; place-items: center; font-weight: 800; }
.menu summary::-webkit-details-marker { display: none; }
.menu .pop { position: absolute; left: 0; top: 46px; z-index: 5; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 12px 30px rgba(0,0,0,.15); min-width: 220px; padding: 6px; }
.menu .who { padding: 8px 10px 10px; border-bottom: 1px solid var(--line); margin-bottom: 4px; }
.menu .who b { display: block; }
.menu .who small { color: var(--ink-2); }
.menu .pop button { display: block; width: 100%; text-align: right; border: 0; background: none; padding: 9px 10px; border-radius: 8px; cursor: pointer; }
.menu .pop button:hover { background: var(--surface-2); }

/* login */
.gate { min-height: calc(100dvh - 40px); display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); align-items: center; justify-items: center; gap: 24px; padding-block: 24px; }
.gate-art { width: 100%; height: min(78dvh, 640px); position: relative; order: 2; }
.gate-art canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.gate-card { position: relative; z-index: 1;
  width: min(420px, 100%); background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 28px 24px; box-shadow: var(--shadow); display: grid; gap: 16px; }
.gate-card .logo { display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; }
.gate-card .logo img { display: none; }
.gate-card .logo b { font-family: var(--f-display); font-weight: 400; font-size: 1.9rem; line-height: 1; color: var(--brand); }
.gate-card .logo span { color: var(--ink-2); }
.tabs { display: grid; grid-template-columns: 1fr 1fr; background: var(--surface-2); border-radius: 12px; padding: 4px; gap: 4px; }
.tabs button { border: 0; background: none; border-radius: 9px; padding: 8px; font-weight: 700; cursor: pointer; color: var(--ink-2); }
.tabs button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.gate-card form { display: grid; gap: 12px; }
.gate-card .hint { color: var(--ink-2); font-size: .92rem; text-align: center; }
.linkish { border: 0; background: none; color: var(--brand); font-weight: 700; cursor: pointer; padding: 0; text-decoration: underline; }
.code-input { text-align: center; letter-spacing: .3em; font-size: 1.3rem !important; font-weight: 700; }

/* home */
.hello h1 { font-family: var(--f-display); font-weight: 400; font-size: clamp(2.2rem, 7vw, 3.6rem); line-height: 1.05; }
.hello p { margin: 4px 0 0; color: var(--ink-2); font-size: 1.15rem; }
.search { position: relative; margin: 20px 0 22px; }
.search input { width: 100%; border: 1px solid transparent; background: var(--surface-2); border-radius: 16px; padding: 15px 20px 15px 52px; font-size: 1.05rem; }
.search input:focus { outline: none; border-color: var(--brand); background: var(--surface); }
.search svg { position: absolute; left: 18px; top: 50%; transform: translateY(-50%); color: var(--ink-2); pointer-events: none; }

.hero { position: relative; display: block; width: 100%; border: 0; padding: 0; cursor: pointer; text-align: right;
  border-radius: var(--r); overflow: hidden; aspect-ratio: 933 / 258; max-width: 100%;
  background: #CFDCC4 url(art/hero.jpg) left center / cover no-repeat; color: var(--on-art); }
.hero .txt { position: absolute; inset-block: 0; right: 0; width: 48%; display: flex; flex-direction: column; justify-content: center; gap: 4px; padding: 0 34px; }
.hero h2 { font-family: var(--f-display); font-weight: 400; font-size: clamp(1.7rem, 4.6vw, 2.7rem); line-height: 1.1; }
.hero p { margin: 0; font-size: 1.15rem; color: #3F5545; }
.hero .meta { margin-top: 10px; display: flex; align-items: center; gap: 10px; }

.arrow { width: 44px; height: 44px; flex: none; border-radius: 50%; background: var(--art-chip); display: grid; place-items: center; color: var(--on-art); }
.art-chip { background: var(--art-chip); color: var(--on-art); border-radius: 999px; padding: 3px 12px; font-size: .85rem; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; }

.row-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin: 30px 0 14px; }
.row-head h2 { font-family: var(--f-display); font-weight: 400; font-size: 1.7rem; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { border: 0; background: var(--chip); color: var(--ink); border-radius: 999px; padding: 7px 18px; cursor: pointer; font-weight: 600; }
.chip[aria-pressed="true"] { background: var(--brand); color: var(--on-brand); }

.tiles { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 16px; }
.tile { position: relative; border: 0; padding: 0; cursor: pointer; border-radius: var(--r); overflow: hidden;
  aspect-ratio: 455 / 221; max-width: 100%; background-size: cover; background-position: center; color: var(--on-art); text-align: left;
  transition: transform .18s ease, box-shadow .18s ease; }
.tile:hover { transform: translateY(-2px); box-shadow: 0 10px 26px rgba(24,38,28,.18); }
.tile h3 { position: absolute; top: 15%; left: 7%; font-family: var(--f-display); font-weight: 400; font-size: clamp(1.35rem, 3.4vw, 2rem); line-height: 1.1; max-width: 55%; text-align: left; }
.tile .foot { position: absolute; left: 7%; bottom: 23%; display: flex; align-items: center; gap: 8px; flex-direction: row-reverse; }
.tile .arrow { width: 42px; height: 42px; }

.dash-card { margin-top: 16px; display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 18px; width: 100%; text-align: right;
  border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 18px 22px; cursor: pointer; box-shadow: var(--shadow); }
.dash-card:hover { border-color: var(--brand); }
.dash-card .ico { width: 52px; height: 52px; border-radius: 14px; background: var(--brand); color: var(--on-brand); display: grid; place-items: center; }
.dash-card h3 { font-family: var(--f-display); font-weight: 400; font-size: 1.4rem; }
.dash-card p { margin: 0; color: var(--ink-2); }
.dash-card .counts { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }

.foot-note { margin-top: 40px; padding-top: 16px; border-top: 1px solid var(--line); text-align: center; color: var(--ink-2); font-size: .92rem; }

/* status pills */
.st { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 2px 11px; font-size: .85rem; font-weight: 700; white-space: nowrap; }
.st::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.st.ok, .st.done { color: var(--ok); background: var(--ok-bg); }
.st.watch, .st.progress { color: var(--warn); background: var(--warn-bg); }
.st.alert, .st.late { color: var(--bad); background: var(--bad-bg); }
.st.none, .st.open { color: var(--none); background: var(--none-bg); }

/* search results */
.results h2 { font-size: 1.05rem; color: var(--ink-2); margin: 18px 0 8px; font-weight: 700; }
.res { display: block; width: 100%; text-align: right; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; margin-bottom: 8px; cursor: pointer; }
.res:hover { border-color: var(--brand); }
.res b { display: block; }
.res small { color: var(--ink-2); }
.empty { color: var(--ink-2); padding: 14px 0; }

/* window page */
.back { border: 0; background: none; color: var(--ink-2); cursor: pointer; padding: 6px 0; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; }
.back:hover { color: var(--ink); }
.w-head { margin: 8px 0 16px; }
.eyebrow { color: var(--ink-2); font-weight: 600; font-size: .95rem; letter-spacing: .01em; }
.w-head h1, .d-title h1 { font-family: var(--f-display); font-weight: 400; font-size: clamp(2rem, 6vw, 2.9rem); line-height: 1.1; }
.d-title p { margin: 2px 0 0; color: var(--ink-2); }
.w-banner { height: 120px; border-radius: var(--r); background-size: cover; background-position: right center; margin-bottom: 18px; }

.status { display: grid; grid-template-columns: 1.1fr 1.3fr 1.3fr .8fr; gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
.status > div { background: var(--surface); padding: 14px 16px; min-width: 0; }
.status h4 { margin: 0 0 6px; font-size: .8rem; color: var(--ink-2); font-weight: 700; letter-spacing: .03em; }
.status ul { margin: 0; padding: 0 18px 0 0; }
.status li { margin-bottom: 2px; }
.status .note { margin-top: 6px; white-space: pre-line; }
.muted { color: var(--ink-2); }
.status .date { font-variant-numeric: tabular-nums; font-weight: 700; font-size: 1.15rem; }

.toolbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin: 22px 0 6px; }
.toolbar .l { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
select.sel { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 7px 10px; }
.btn { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 10px; padding: 8px 14px; cursor: pointer; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.btn:hover { border-color: var(--ink-2); }
.btn.primary { background: var(--brand); color: var(--on-brand); border-color: var(--brand); }
.btn.primary:hover { filter: brightness(1.1); }
.btn.danger { color: var(--bad); }
.btn.small { padding: 4px 10px; font-size: .9rem; }
.btn.wide { width: 100%; padding: 11px; font-size: 1.05rem; }
.btn[disabled] { opacity: .6; cursor: progress; }

.links { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
.section { margin-top: 26px; }
.section-h { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; border-bottom: 2px solid var(--brand); padding-bottom: 6px; margin-bottom: 10px; }
.section-h h2 { font-size: 1.3rem; font-weight: 800; }
.section-h .n { color: var(--ink-2); font-variant-numeric: tabular-nums; font-weight: 600; margin-inline-start: 8px; font-size: .95rem; }
.add { border: 0; background: none; color: var(--brand); font-weight: 700; cursor: pointer; padding: 2px 4px; white-space: nowrap; }
.items { display: grid; gap: 8px; }
.item { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; min-width: 0; }
.item.flash { animation: flash 1.6s ease; }
@keyframes flash { 0%,40% { border-color: var(--brand); box-shadow: 0 0 0 3px var(--chip); } 100% { } }
.item-top { display: flex; align-items: flex-start; gap: 10px; justify-content: space-between; }
.item-top .t { font-weight: 700; font-size: 1.05rem; overflow-wrap: anywhere; }
.item-top .r { display: flex; gap: 6px; align-items: center; flex: none; }
.item .body { margin: 4px 0 0; white-space: pre-line; overflow-wrap: anywhere; }
.meta { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 6px; color: var(--ink-2); font-size: .9rem; }
.meta .late { color: var(--bad); font-weight: 700; }
.file-link { display: inline-flex; align-items: center; gap: 5px; font-weight: 600; }
.icon-btn { border: 0; background: none; color: var(--ink-2); cursor: pointer; padding: 4px; border-radius: 6px; }
.icon-btn:hover { color: var(--ink); background: var(--surface-2); }
.none-yet { color: var(--ink-2); font-size: .95rem; padding: 6px 0 2px; }

/* dashboard */
.summary { display: grid; grid-template-columns: 1.6fr 1fr 1fr 1fr; gap: 12px; margin: 20px 0; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; min-width: 0; }
.stat h4 { margin: 0 0 6px; font-size: .82rem; color: var(--ink-2); font-weight: 700; }
.stat .big { font-family: var(--f-display); font-size: 2.1rem; line-height: 1; font-variant-numeric: tabular-nums; }
.stat .big.bad { color: var(--bad); }
.bar { display: flex; height: 12px; border-radius: 6px; overflow: hidden; background: var(--none-bg); margin: 6px 0 8px; }
.bar i { display: block; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: .85rem; color: var(--ink-2); }
.legend b { color: var(--ink); font-variant-numeric: tabular-nums; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 22px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; min-width: 0; }
.panel h3 { font-size: 1.05rem; font-weight: 800; margin-bottom: 8px; }
.plist { margin: 0; padding: 0; list-style: none; }
.plist li { padding: 7px 0; border-top: 1px solid var(--line); display: flex; justify-content: space-between; gap: 10px; align-items: center; }
.plist li:first-child { border-top: 0; }
.plist .src { color: var(--ink-2); font-size: .88rem; white-space: nowrap; }
.plist .go { border: 0; background: none; padding: 0; text-align: right; cursor: pointer; color: inherit; }
.plist .go:hover { color: var(--brand); text-decoration: underline; }

.table { border: 1px solid var(--line); border-radius: 14px; overflow: hidden; background: var(--line); display: grid; gap: 1px; }
.tr { display: grid; grid-template-columns: 1.3fr 1fr 1.6fr .6fr .6fr; gap: 14px; align-items: center; background: var(--surface); padding: 12px 16px; text-align: right; border: 0; width: 100%; cursor: pointer; }
.tr:hover { background: var(--surface-2); }
.tr.th { cursor: default; background: var(--brand); color: var(--on-brand); font-weight: 700; font-size: .9rem; }
.tr .nm { font-weight: 800; }
.tr .gl { color: var(--ink-2); font-size: .9rem; }
.tr .gaps { font-size: .92rem; overflow-wrap: anywhere; }
.tr .num { font-variant-numeric: tabular-nums; font-weight: 700; }
.lbl { display: none; color: var(--ink-2); font-size: .8rem; font-weight: 600; }

/* admin */
.admin-grid { display: grid; gap: 16px; margin-top: 18px; }
.panel form { display: grid; gap: 10px; }
.erow { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; padding: 10px 0; border-top: 1px solid var(--line); }
.erow:first-of-type { border-top: 0; }
.erow .acts { display: flex; gap: 6px; flex-wrap: wrap; }
.okbox { background: var(--ok-bg); border-radius: 12px; padding: 12px 14px; display: grid; gap: 6px; }
.okbox pre { margin: 0; white-space: pre-wrap; font-family: var(--f-body); }

/* forms + dialogs */
dialog { border: 0; border-radius: 18px; padding: 0; width: min(560px, calc(100vw - 32px)); background: var(--surface); color: var(--ink); box-shadow: 0 20px 60px rgba(0,0,0,.3); }
dialog::backdrop { background: rgba(10,20,12,.45); }
dialog form { padding: 20px 22px; display: grid; gap: 12px; max-height: 85vh; overflow: auto; }
dialog h2 { font-size: 1.3rem; font-weight: 800; }
.f { display: grid; gap: 4px; min-width: 0; }
.f label { font-weight: 700; font-size: .9rem; }
.f input, .f select, .f textarea { width: 100%; border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 10px 11px; font-size: 1rem; }
.f textarea { min-height: 84px; resize: vertical; }
.f small { color: var(--ink-2); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.actions { display: flex; gap: 8px; justify-content: space-between; flex-wrap: wrap; margin-top: 4px; }
.actions .l { display: flex; gap: 8px; }
.err { color: var(--bad); font-weight: 600; min-height: 1.2em; }
.cur-file { display: flex; gap: 10px; align-items: center; font-size: .92rem; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 12px; font-weight: 600; z-index: 10; max-width: calc(100vw - 32px); }
.loading { padding: 80px 0; text-align: center; color: var(--ink-2); }

@media (max-width: 860px) {
  .gate { grid-template-columns: 1fr; gap: 0; align-content: start; padding-top: 4px; }
  .gate-art { height: 38dvh; min-height: 240px; margin-bottom: -20px; order: 0; }
}
@media (max-width: 760px) {
  .status { grid-template-columns: 1fr 1fr; }
  .summary { grid-template-columns: 1fr 1fr; }
  .summary .stat:first-child { grid-column: 1 / -1; }
  .two { grid-template-columns: 1fr; }
  .tr { grid-template-columns: 1fr auto; gap: 6px 12px; }
  .tr.th { display: none; }
  .tr .gl, .tr .gaps { grid-column: 1 / -1; }
  .tr .c-dec, .tr .c-upd { display: flex; gap: 6px; align-items: baseline; }
  .lbl { display: inline; }
  .dash-card { grid-template-columns: auto 1fr; }
  .dash-card .counts { grid-column: 1 / -1; justify-content: flex-start; }
}
@media (max-width: 600px) {
  .tiles { grid-template-columns: 1fr; }
  .hero { aspect-ratio: auto; min-height: 210px; }
  .hero::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to left, rgba(207,220,196,.95) 30%, rgba(207,220,196,.55) 65%, rgba(207,220,196,0)); }
  .hero .txt { width: 72%; padding: 0 20px; z-index: 1; }
  .grid2 { grid-template-columns: 1fr; }
  .status { grid-template-columns: 1fr; }
  .top .pill-btn { padding: 8px 12px; }
}
@media (prefers-reduced-motion: reduce) { .tile, .item.flash { transition: none; animation: none; } }
</style>
</head>
<body>
<div class="wrap" id="app">
  <header class="top" id="top" hidden>

function openItem(w, it = null, sid = null) {
  editing = { w, it }; delArmed = false; removeFile = false;
  $('#itemDlgTitle').textContent = (it ? 'עריכת תוכן' : 'הוספת תוכן') + ' · ' + w.name;
  $('#f-section').replaceChildren(...w.sections.map(([id, n]) => h('option', { value: id, text: n })));
  $('#f-section').value = it?.s || sid || w.sections[0][0];
  $('#f-title').value = it?.title || '';
  $('#f-body').value = it?.body || '';
  $('#f-link').value = it?.link || '';
  $('#f-cycle').value = it?.cycle || S.cycle || '';
  $('#f-owner').value = it?.owner || '';
  $('#f-due').value = it?.due || '';
  $('#f-status').value = it?.status || '';
  $('#f-file').value = '';
  $('#cycles').replaceChildren(...[...new Set(S.items.map(i => i.cycle).filter(Boolean))].map(c => h('option', { value: c })));
  const cur = $('#curFile');
  if (it?.file_path) {
    cur.hidden = false;
    cur.replaceChildren(h('span', {}, I.clip(), ' ', it.file_name || 'קובץ מצורף'),
      h('button', { class: 'btn small', type: 'button', text: 'הסרה', onclick: () => { removeFile = true; cur.hidden = true; } }));
  } else cur.hidden = true;
  $('#itemDel').hidden = !it; $('#itemDel').textContent = 'מחיקה';
  $('#itemErr').textContent = '';
  $('#itemDlg').showModal();
}

$('#itemDel').onclick = async () => {
  if (!editing?.it) return;
  if (!delArmed) { delArmed = true; $('#itemDel').textContent = 'למחוק לצמיתות?'; return; }
  const it = editing.it;
  const { error } = await sb.from('items').delete().eq('id', it.id);
  if (error) { $('#itemErr').textContent = writeFailed(error); return; }
  if (it.file_path) sb.storage.from('files').remove([it.file_path]);
  $('#itemDlg').close(); toast('התוכן נמחק'); loadData();
};

$('#itemForm').addEventListener('submit', async e => {
  e.preventDefault();
  const title = $('#f-title').value.trim();
  const link = $('#f-link').value.trim();
  if (!title) { $('#itemErr').textContent = 'חסרה כותרת.'; $('#f-title').focus(); return; }
  if (link && !safeUrl(link)) { $('#itemErr').textContent = 'הקישור צריך להתחיל ב-https://'; $('#f-link').focus(); return; }
  const btn = $('#itemSave'); btn.disabled = true; btn.textContent = 'שומר…'; $('#itemErr').textContent = '';
  const { w, it } = editing;
  const now = new Date().toISOString();
  const row = {
    w: w.id, s: $('#f-section').value, title, body: $('#f-body').value.trim(), link,
    cycle: $('#f-cycle').value.trim(), owner: $('#f-owner').value.trim(), due: $('#f-due').value || null, status: $('#f-status').value,
    file_path: removeFile ? '' : (it?.file_path || ''), file_name: removeFile ? '' : (it?.file_name || ''),
    updated_at: now, updated_by: S.uid,
  };
  const oldFile = it?.file_path || '';
  const f = $('#f-file').files[0];
  if (f) {
    if (f.size > 50 * 1024 * 1024) { $('#itemErr').textContent = 'הקובץ גדול מ-50MB. כווצו אותו או הוסיפו קישור.'; btn.disabled = false; btn.textContent = 'שמירה'; return; }
    btn.textContent = 'מעלה קובץ…';
    const ext = (f.name.split('.').pop() || 'bin').toLowerCase().replace(/[^a-z0-9]/g, '').slice(0, 8) || 'bin';
    const path = `${w.id}/${crypto.randomUUID()}.${ext}`;
    const { error } = await sb.storage.from('files').upload(path, f, { contentType: f.type || 'application/octet-stream', upsert: false });
    if (error) { $('#itemErr').textContent = 'העלאת הקובץ נכשלה. ' + (/size|large/i.test(error.message) ? 'הקובץ גדול מדי.' : 'נסו שוב.'); btn.disabled = false; btn.textContent = 'שמירה'; return; }
    row.file_path = path; row.file_name = f.name;
  }
  const q = it ? sb.from('items').update(row).eq('id', it.id) : sb.from('items').insert({ ...row, created_by: S.uid });
  const { error } = await q;
  btn.disabled = false; btn.textContent = 'שמירה';
  if (error) { $('#itemErr').textContent = writeFailed(error); if (f) sb.storage.from('files').remove([row.file_path]); return; }
  if (oldFile && oldFile !== row.file_path) sb.storage.from('files').remove([oldFile]);
  $('#itemDlg').close(); toast(it ? 'התוכן עודכן' : 'התוכן נוסף'); loadData();
});

function openMeta(w) {
  editing = { w };
  const m = S.meta[w.id] || {};
  $('#metaDlgTitle').textContent = 'עדכון מצב · ' + w.name;
  $('#m-status').value = m.status || '';
  $('#m-note').value = m.note || '';
  $('#m-gaps').value = m.gaps || '';
  $('#m-dec').value = m.decisions || '';
  $('#metaErr').textContent = '';
  $('#metaDlg').showModal();
}
$('#metaForm').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = $('#metaSave'); btn.disabled = true;
  const { error } = await sb.from('window_meta').upsert({
    id: editing.w.id, status: $('#m-status').value, note: $('#m-note').value.trim(), gaps: $('#m-gaps').value.trim(), decisions: $('#m-dec').value.trim(),
    updated_at: new Date().toISOString(), updated_by: S.uid });
  btn.disabled = false;
  if (error) { $('#metaErr').textContent = writeFailed(error); return; }
  $('#metaDlg').close(); toast('המצב עודכן'); loadData();
});

$('#passForm').addEventListener('submit', async e => {
  e.preventDefault();
  const a = $('#p-new').value, b = $('#p-again').value;
  if (a.length < 8) { $('#passErr').textContent = 'לפחות 8 תווים.'; return; }
  if (a !== b) { $('#passErr').textContent = 'הסיסמאות לא תואמות.'; return; }
  $('#passSave').disabled = true;
  const { error } = await sb.auth.updateUser({ password: a });
  $('#passSave').disabled = false;
  if (error) { $('#passErr').textContent = /different|same/i.test(error.message) ? 'הסיסמה החדשה זהה לישנה.' : 'ההחלפה לא הצליחה. נסו שוב.'; return; }
  $('#passDlg').close(); toast('הסיסמה הוחלפה');
});

/* ---------- sign-in art: the Golani emblem on a golden sun, looping (breeze, sheen, falling leaves) ---------- */
let treeEl = null, treeKick = null;
function treeArt() {
  if (treeEl) { treeKick(); return treeEl; }
  const canvas = h('canvas', { 'aria-hidden': 'true' });
  treeEl = h('div', { class: 'gate-art' }, canvas);
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const img = new Image(); img.src = 'art/emblem.png';
  const off = document.createElement('canvas'), fx = document.createElement('canvas');
  let L = null, t0 = 0, running = false, leaves = [];

  function fit() {
    const box = treeEl.getBoundingClientRect(); if (!box.width || !box.height || !img.complete || !img.naturalWidth) return;
    const dpr = Math.min(2, devicePixelRatio || 1);
    canvas.width = Math.round(box.width * dpr); canvas.height = Math.round(box.height * dpr);
    const ratio = img.naturalWidth / img.naturalHeight;
    const eh = Math.min(box.height * .8, box.width * .78 / ratio), ew = eh * ratio;
    const pad = Math.ceil(eh * .03);
    off.width = Math.round(ew * dpr); off.height = Math.round(eh * dpr);
    const o = off.getContext('2d'); o.imageSmoothingQuality = 'high'; o.drawImage(img, 0, 0, off.width, off.height);
    fx.width = off.width + pad * 2 * dpr; fx.height = off.height;
    L = { w: box.width, h: box.height, dpr, ew, eh, pad, x: (box.width - ew) / 2, y: box.height * .9 - eh };
    if (!running) draw(reduce ? 9 : 0);
  }

  const rand = (a, b) => a + Math.random() * (b - a);
  function spawnLeaf(now, first) {
    return { born: now + (first ? rand(0, 6000) : rand(300, 2500)), life: rand(5200, 8000),
      x: L.x + L.ew * rand(.18, .85), y: L.y + L.eh * rand(.12, .45), drift: rand(.5, 1.4) * (Math.random() < .5 ? -1 : 1),
      size: L.eh * rand(.022, .034), spin: rand(-2.2, 2.2), phase: rand(0, 6.28) };
  }

  function draw(sec) {
    if (!L) return;
    const { w, hgt = L.h, dpr, ew, eh, pad, x, y } = L;
    const ctx = canvas.getContext('2d'); ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, w, hgt);
    const css = getComputedStyle(document.documentElement), c = n => css.getPropertyValue(n).trim();
    const intro = Math.min(1, sec / 1.6), ease = 1 - Math.pow(1 - intro, 3);

    // sun with a slow breathing halo
    const cx = x + ew * .5, cy = y + eh * .36, R = ew * .6 * (.8 + .2 * ease) * (1 + .015 * Math.sin(sec * .9));
    const halo = ctx.createRadialGradient(cx, cy, R * .9, cx, cy, R * (1.35 + .08 * Math.sin(sec * .6)));
    halo.addColorStop(0, c('--sun')); halo.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.globalAlpha = .55 * ease; ctx.fillStyle = halo; ctx.beginPath(); ctx.arc(cx, cy, R * 1.5, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = ease; ctx.fillStyle = c('--sun'); ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
    // ground
    ctx.fillStyle = c('--ground'); ctx.beginPath(); ctx.ellipse(cx, y + eh * .965, ew * .62, eh * .045, 0, 0, Math.PI * 2); ctx.fill();

    // emblem in strips: canopy sways, trunk and roots stay put
    const f = fx.getContext('2d'); f.setTransform(1, 0, 0, 1, 0, 0); f.clearRect(0, 0, fx.width, fx.height);
    const A = reduce ? 0 : eh * .011, trunkTop = .58, step = 2;
    for (let sy = 0; sy < off.height; sy += step) {
      const v = sy / off.height, k = Math.pow(Math.max(0, (trunkTop - v) / trunkTop), 1.4);
      const dx = (A * k * (Math.sin(sec * 1.1 + v * 5) + .45 * Math.sin(sec * 2.6 + v * 13))) * dpr;
      f.drawImage(off, 0, sy, off.width, step, pad * dpr + dx, sy, off.width, step);
    }
    // a golden sheen crossing the emblem every 7 seconds
    if (!reduce) {
      const ph = ((sec - 1.6) % 7) / 1.6;
      if (sec > 1.6 && ph < 1) {
        const bx = -fx.width * .4 + ph * fx.width * 1.8;
        const g = f.createLinearGradient(bx, 0, bx + fx.width * .35, fx.height);
        g.addColorStop(0, 'rgba(255,236,160,0)'); g.addColorStop(.5, 'rgba(255,236,160,.5)'); g.addColorStop(1, 'rgba(255,236,160,0)');
        f.globalCompositeOperation = 'source-atop'; f.fillStyle = g; f.fillRect(0, 0, fx.width, fx.height); f.globalCompositeOperation = 'source-over';
      }
    }
    // reveal from the roots up on first load
    const revealTop = y + eh * (1 - ease);
    ctx.save(); ctx.beginPath(); ctx.rect(0, revealTop, w, hgt); ctx.clip();
    ctx.drawImage(fx, x - pad, y, fx.width / dpr, fx.height / dpr);
    ctx.restore();

    // falling leaves
    if (!reduce && intro >= 1) {
      const now = performance.now();
      if (!leaves.length) leaves = Array.from({ length: 6 }, () => spawnLeaf(now, true));
      ctx.fillStyle = '#2E8B3A';
      leaves.forEach((lf, i) => {
        const a = (now - lf.born) / lf.life;
        if (a < 0) return;
        if (a >= 1) { leaves[i] = spawnLeaf(now, false); return; }
        const lx = lf.x + lf.drift * a * ew * .22 + Math.sin(a * 7 + lf.phase) * ew * .025;
        const ly = lf.y + a * (y + eh * .95 - lf.y);
        ctx.save(); ctx.translate(lx, ly); ctx.rotate(lf.phase + a * lf.spin * 3);
        ctx.globalAlpha = Math.min(1, a * 6) * (1 - Math.pow(a, 3)) * .9;
        ctx.beginPath(); ctx.moveTo(-lf.size, 0); ctx.quadraticCurveTo(0, -lf.size * .7, lf.size, 0); ctx.quadraticCurveTo(0, lf.size * .7, -lf.size, 0); ctx.fill();
        ctx.restore();
      });
      ctx.globalAlpha = 1;
    }
  }

  function frame(now) {
    if (!treeEl.isConnected) { running = false; return; }
    if (!t0) t0 = now;
    draw((now - t0) / 1000);
    requestAnimationFrame(frame);
  }
  treeKick = () => { if (!reduce && !running) { running = true; requestAnimationFrame(frame); } };
  img.onload = () => { fit(); treeKick(); };
  new ResizeObserver(fit).observe(treeEl);
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (reduce) draw(9); });
  return treeEl;
}

/* ---------- sign-in ---------- */
let gateMode = 'code';
async function showGate(msg = '') {
  S.role = null; S.viewKey = null;
  $('#top').hidden = true; $('#foot').hidden = true;
  let needsSetup = false;
  try { needsSetup = (await callAdmin('status')).needsSetup; } catch {}
  if (gateMode === 'setup' && !needsSetup) gateMode = 'code';
  const err = h('div', { class: 'err', role: 'alert', text: msg });
  const busy = (form, on, label) => { const b = form.querySelector('[type=submit]'); b.disabled = on; if (label) b.textContent = label; };

  const codeForm = h('form', { novalidate: true, onsubmit: async e => {
      e.preventDefault(); err.textContent = '';
      const code = $('#g-code').value.trim(); if (!code) { err.textContent = 'הקלידו את קוד היחידה.'; return; }
      busy(e.target, true, 'נכנס…');
      const { error } = await sb.auth.signInWithPassword({ email: VIEWER_EMAIL, password: code });
      if (error) { busy(e.target, false, 'כניסה'); err.textContent = /invalid/i.test(error.message) ? 'הקוד שגוי. בדקו מול המפקד ונסו שוב.' : 'הכניסה לא הצליחה. נסו שוב בעוד דקה.'; }
    } },
    h('div', { class: 'f' }, h('label', { for: 'g-code', text: 'קוד יחידה' }),
      h('input', { id: 'g-code', class: 'code-input', type: 'password', autocomplete: 'current-password', inputmode: 'text', dir: 'ltr' })),
    h('button', { class: 'btn primary wide', type: 'submit', text: 'כניסה' }));

  const edForm = h('form', { novalidate: true, onsubmit: async e => {
      e.preventDefault(); err.textContent = '';
      const email = $('#g-email').value.trim(), password = $('#g-pass').value;
      if (!email || !password) { err.textContent = 'הקלידו מייל וסיסמה.'; return; }
      busy(e.target, true, 'נכנס…');
      const { error } = await sb.auth.signInWithPassword({ email, password });
      if (error) { busy(e.target, false, 'כניסה'); err.textContent = /invalid/i.test(error.message) ? 'המייל או הסיסמה שגויים.' : 'הכניסה לא הצליחה. נסו שוב בעוד דקה.'; }
    } },
    h('div', { class: 'f' }, h('label', { for: 'g-email', text: 'מייל' }), h('input', { id: 'g-email', type: 'email', autocomplete: 'username', dir: 'ltr' })),
    h('div', { class: 'f' }, h('label', { for: 'g-pass', text: 'סיסמה' }), h('input', { id: 'g-pass', type: 'password', autocomplete: 'current-password', dir: 'ltr' })),
    h('button', { class: 'btn primary wide', type: 'submit', text: 'כניסה' }),
    h('p', { class: 'hint', text: 'שכחתם סיסמה? מנהל האתר יכול לאפס אותה.' }));

  const setupForm = h('form', { novalidate: true, onsubmit: async e => {
      e.preventDefault(); err.textContent = '';
      const displayName = $('#s-name').value.trim(), email = $('#s-email').value.trim(), password = $('#s-pass').value, again = $('#s-again').value, unitCode = $('#s-code').value.trim();
      if (password !== again) { err.textContent = 'הסיסמאות לא תואמות.'; return; }
      busy(e.target, true, 'מגדיר…');
      try {
        await callAdmin('setup', { displayName, email, password, unitCode });
        const { error } = await sb.auth.signInWithPassword({ email, password });
        if (error) throw new Error('ההגדרה נשמרה, אבל הכניסה נכשלה. נסו להיכנס כעורך.');
      } catch (ex) { busy(e.target, false, 'שמירה וכניסה'); err.textContent = ex.message; }
    } },
    h('p', { class: 'hint', style: 'text-align:right;margin:0', text: 'הגדרה חד-פעמית של מנהל האתר וקוד היחידה.' }),
    h('div', { class: 'f' }, h('label', { for: 's-name', text: 'השם שלך' }), h('input', { id: 's-name', maxlength: '60' })),
    h('div', { class: 'f' }, h('label', { for: 's-email', text: 'המייל שלך' }), h('input', { id: 's-email', type: 'email', autocomplete: 'username', dir: 'ltr' })),
    h('div', { class: 'grid2' },
      h('div', { class: 'f' }, h('label', { for: 's-pass', text: 'סיסמה' }), h('input', { id: 's-pass', type: 'password', autocomplete: 'new-password', dir: 'ltr' }), h('small', { text: 'לפחות 8 תווים' })),
      h('div', { class: 'f' }, h('label', { for: 's-again', text: 'שוב, לאימות' }), h('input', { id: 's-again', type: 'password', autocomplete: 'new-password', dir: 'ltr' }))),
    h('div', { class: 'f' }, h('label', { for: 's-code', text: 'קוד יחידה לצפייה' }), h('input', { id: 's-code', autocomplete: 'off', dir: 'ltr' }),
      h('small', { text: 'לפחות 6 תווים. את הקוד הזה תפיצו ביחידה. אפשר להחליף אותו בכל רגע.' })),
    h('button', { class: 'btn primary wide', type: 'submit', text: 'שמירה וכניסה' }));

  const tab = (mode, label) => h('button', { type: 'button', role: 'tab', 'aria-selected': String(gateMode === mode), text: label,
    onclick: () => { gateMode = mode; showGate(); } });
  $('#view').replaceChildren(h('div', { class: 'gate' }, treeArt(), h('div', { class: 'gate-card' },
    h('div', { class: 'logo' }, h('img', { src: 'art/tree.png', alt: '' }), h('b', { text: 'בא״ח גולני' }), h('span', { text: 'אגף ההדרכה · כל הכלים במקום אחד' })),
    gateMode === 'setup' ? null : h('div', { class: 'tabs', role: 'tablist' }, tab('code', 'קוד יחידה'), tab('editor', 'כניסת עורכים')),
    gateMode === 'code' ? codeForm : gateMode === 'editor' ? edForm : setupForm,
    err,
    needsSetup && gateMode !== 'setup' ? h('p', { class: 'hint' }, 'האתר עוד לא הוגדר. ', h('button', { class: 'linkish', type: 'button', text: 'הגדרה ראשונית', onclick: () => { gateMode = 'setup'; showGate(); } })) : null,
    gateMode === 'setup' ? h('p', { class: 'hint' }, h('button', { class: 'linkish', type: 'button', text: 'חזרה לכניסה', onclick: () => { gateMode = 'code'; showGate(); } })) : null)));
  (document.getElementById('g-code') || document.getElementById('g-email') || document.getElementById('s-name'))?.focus();
}

async function enter(session) {
  const { data: me, error } = await sb.from('members').select('role, display_name, email').eq('user_id', session.user.id).maybeSingle();
  if (error || !me) { await sb.auth.signOut(); return showGate('החשבון הזה לא מורשה לאתר. פנו למנהל האתר.'); }
  S.session = session; S.uid = session.user.id; S.role = me.role; S.canEdit = me.role === 'editor' || me.role === 'admin';
  const label = me.role === 'viewer' ? 'צופה' : (me.display_name || me.email);
  $('#menuBtn').textContent = (label || '?').trim().charAt(0);
  $('#menuName').textContent = label; $('#menuRole').textContent = ROLE[me.role];
  $('#mPass').hidden = !S.canEdit; $('#mAdmin').hidden = me.role !== 'admin';
  $('#top').hidden = false; $('#foot').hidden = false;
  readHash(); S.viewKey = null;
  $('#view').replaceChildren(h('p', { class: 'loading', text: 'טוען…' }));
  await loadData(); render(); subscribe();
}

/* ---------- boot ---------- */
$('#brandBtn').onclick = () => go('home');
$('#dashBtn').onclick = () => go('dashboard');
$('#mOut').onclick = async () => { $('#menu').open = false; channel?.unsubscribe(); await sb.auth.signOut(); };
$('#mPass').onclick = () => { $('#menu').open = false; $('#p-new').value = ''; $('#p-again').value = ''; $('#passErr').textContent = ''; $('#passDlg').showModal(); };
$('#mAdmin').onclick = () => go('admin');
document.addEventListener('click', e => { if (!e.target.closest('#menu')) $('#menu').open = false; });

let entered = null;
sb.auth.onAuthStateChange((event, session) => {
  if (session) {
    if (entered !== session.user.id) { entered = session.user.id; setTimeout(() => enter(session), 0); }
  } else {
    entered = null; channel?.unsubscribe(); setTimeout(() => showGate(), 0);
  }
});
</script>
</body>
